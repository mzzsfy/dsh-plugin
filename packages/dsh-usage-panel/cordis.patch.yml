# The usage-panel bundle patch: inserts the balance panel plugin into the
# profile root as one entry. Applied by `dsh plugin add @mzzsfy/dsh-usage-panel`;
# the row id addresses this plugin's host half, whose `/api/usage-panel/*`
# routes serve the browser half rendered in the settings page.

- insert:
    - id: usage-panel
      name: '@mzzsfy/dsh-usage-panel'

# 公共 client 依赖的装载行:宿主按包名合并成单份 client 模块;每个消费插件自带
# 一行,装任一插件即可独立运行;该依赖不单独成插件卡,只在所属插件详情页作为只读部件行出现(不可开关)。
- insert:
    - id: usage-panel-dsh-common-tools
      name: '@mzzsfy/dsh-common-tools'
