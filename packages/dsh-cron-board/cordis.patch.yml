# dsh-cron-board 打包补丁:将定时任务面板插件以单条目注入 profile 根。由 `dsh plugin add @mzzsfy/dsh-cron-board` 应用;
# 条目 id 指向本插件宿主半区,/api/cron-board/* 路由由此宿主条目 provide,client 半区随宿主条目进入客户端模块表。
- insert:
    - id: cron-board
      name: '@mzzsfy/dsh-cron-board'

# 公共 client 依赖的装载行:宿主按包名合并成单份 client 模块;每个消费插件自带
# 一行,装任一插件即可独立运行;该依赖不进 profile 依赖清单,插件管理页不展示。
- insert:
    - id: cron-board-dsh-common-tools
      name: '@mzzsfy/dsh-common-tools'
