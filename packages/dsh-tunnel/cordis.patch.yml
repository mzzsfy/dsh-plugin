# dsh-tunnel bundle patch: 把本包 host 平面行注册进 profile 根
# (`dsh plugin add @mzzsfy/dsh-tunnel` 应用):
#   - 穿透隧道: /p/<name> 前缀路由 + 监听层 Host/路径分发(HTTP 与任意 WS 路径) + /api/tunnel REST 面 + ai 工具三件。
#   - client 半区(隧道看板 + 设置页卡片)随宿主条目进入客户端模块表(dsh.client.platform=web)。
# 隧道表存自有文件 ~/.dsh/dsh-tunnel/tunnels.json; 设置偏好(侧边栏开关/超时)经宿主 settings 服务。

- insert:
    - id: dsh-tunnel
      name: '@mzzsfy/dsh-tunnel'

# 公共 client 依赖的装载行:宿主按包名合并成单份 client 模块;每个消费插件自带
# 一行,装任一插件即可独立运行;该依赖不单独成插件卡,只在所属插件详情页作为只读部件行出现(不可开关)。
- insert:
    - id: tunnel-dsh-common-tools
      name: '@mzzsfy/dsh-common-tools'
