# The `rs-workflow` agent preset: 若水工作流(v5,主循环协作编排)。
#
# 本文件是释放骨架源:release 生成器把它作为唯一源生成 rs-<id> 模式组合
# (运行时仅改写 orchestrator 行的 templateId 锚定),不在包内被宿主装载。
#
# 基底是 `standard` 全功能编码代理行集,差异:
#   1. persona 换成流程模式纪律 v5(人机接口+受约束规划者,任务交付由编排子代理承担);
#   2. delegation 组内 rs-workflow-orchestrator 工具行(v4 takeover 行删除)与 template-tool 行;
#   3. 无 report 行(trace 事件 + run-store 取代);plan-mode 组移除(规划在编排内)。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是"若水工作流"会话代理,由 {{model}} 模型驱动。你负责人机协作与编排调度;
      任务交付由流程引擎接管下的子代理完成,你不直接产出交付物。
      职责判据:
      1. 简单请求(一句话能答、小改动、纯问答)→ 直接答复,不起编排;
      2. 多步骤交付类任务 → 调用 rs_workflow_start,提交结构化规划(steps 各步要点与验收口径);
         规划被拒时按 errors 修正重交,连续 3 次被拒则回退直接答复并说明;
      3. 编排运行中你只被段结束通知唤醒:审批到达(按模板 autoApprove 决定代审或 ask_user 转呈真人,裁决后
         rs_workflow_resume 拉起下一段)、终态汇报(完成经 deliverables 交付;失败/阻塞说明卡点与建议);
         用户中途纠偏经 rs_workflow_message 注入,下一步骤边界进入编排;
      4. 你不代替子代理执行编排内步骤,不伪造产出,不跳过引擎直接交付;
      5. 引擎不可用或编排启动失败时,回退为普通会话代理完成请求并说明。
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web ─────────────────────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── compaction ──────────────────────────────────────────────────────────────

# 编排子代理上下文较长,保留 standard 的压缩组。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# workflowEngine 是预设私有服务(preset 组合发布全局服务会被宿主拒绝 mount),
# 所有触达它的行共享一个 entry-local isolate realm。
# orchestrator 行注册 rs_workflow_* 五工具并经 jobs 服务拉起分段 continuable job;
# 控制队列与 store 为普通模块单例,host/agent 行经同一 realpath 解析共享实例。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    # orchestrator 工具行:模板 id 由组合名承载(rs-<id> → <id>),释放生成器按组合名写入
    - id: rs-workflow-orchestrator
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: orchestrator
        templateId: TPL_ANCHOR

    # 模板编辑工具行:rs_workflow_template(AI 按口述逻辑生成/修改流程模板)
    - id: rs-workflow-template-tool
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: template-tool

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
