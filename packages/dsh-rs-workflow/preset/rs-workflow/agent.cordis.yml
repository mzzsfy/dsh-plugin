# The `rs-workflow` agent preset: 若水协作编码流程(collab 内置模板)。
#
# 迁移自 rs-tui (../rscli) 的 rs-workflow 多模型协作工作流引擎,形态为"引擎接管":
# 本组合的 takeover 行(agent/pre-step)拦截一切用户消息,经 workflowEngine 启动
# 协作编排(插件自带 engine/collab.js 脚本),主会话模型零参与;每个节点的
# planner/executor/reviewer 由编排内子代理承担,子代理继承本组合全部工具行。
#
# 基底是 `standard` 全功能编码代理(行集与出厂 standard 保持同构),差异有两处:
#   1. persona 换成流程模式纪律(会话代理只在运行期答疑,不执行交付);
#   2. delegation 组内追加 takeover 行(role: takeover, kind: collab),并保留
#      report 行(子代理节点软上报);plan-mode 组移除(规划发生在编排内部)。
#
# 本文件整体由该包的 preset-sync 角色行释放到用户预设根,随插件安装/升级自动同步。
#
# 平面规则与 standard 一致:本文件是 AGENT-PLANE 组合;服务行必须在 isolate realm 后面。

# ── identity ────────────────────────────────────────────────────────────────

# persona 键名随 dsh 版本断裂(0.1.5-rc.1 起 text → prefix/suffix,prefix required)。
# 仓库源码恒为新版形态;旧宿主由 preset-sync 在释放时按目标宿主版本回退改写,
# 兼容矩阵见包 README「版本兼容」节。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是"若水工作流"协作编码模式会话代理,由 {{model}} 模型驱动。
      本模式的一切用户请求都由若水流程引擎接管执行(pre-step 拦截,你收不到任务原文):
      planner 分诊规划、executor 执行、reviewer 审批,全部由编排内子代理承担。
      你唯一可能被调用的场景:流程运行期间用户追加消息。此时只做简短答疑,
      不执行任何交付操作,不尝试启动或修改工作流,回答完即止。
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 与 standard 相同:两个 shell 工具消费 HOST 侧注册表,执行器也在 host 平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web ─────────────────────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── compaction ──────────────────────────────────────────────────────────────

# 编排子代理上下文较长,保留 standard 的压缩组。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# 与 standard 相同:subagents 注册表留在 HOST;workflowEngine 是预设私有服务,
# 所有触达它的行共享一个 entry-local realm。takeover 行也在组内:
# pre-step 拦截用户消息并经 workflowEngine 启动协作编排。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    # 引擎接管行:collab 内置模板(脚本 = 包内 engine/collab.js)
    - id: rs-workflow-takeover
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: takeover
        kind: collab

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 运行看板上报工具(rs_workflow_report):编排子代理节点级软上报(可选,失败即弃)
- id: rs-workflow-report
  name: '@mzzsfy/dsh-rs-workflow'
  config:
    role: report
