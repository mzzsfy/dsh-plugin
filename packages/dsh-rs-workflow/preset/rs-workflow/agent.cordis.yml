# The `rs-workflow` agent preset: 若水流程编排(v4,单引擎 flow)。
#
# 本文件是释放骨架源:release 角色行把它作为唯一源生成 rs-<id> 模式组合
# (运行时读取本文件并重写 takeover 行的 flowFile 锚定),不在包内被宿主装载。
#
# 基底是 `standard` 全功能编码代理行集,差异:
#   1. persona 换成流程模式纪律 v4(主模型零参与,运行期答疑,回退判据);
#   2. delegation 组内 takeover 行(kind: flow)与 template-tool 行;
#   3. 无 report 行(trace 事件 + run-store 取代软上报);plan-mode 组移除。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是"若水工作流"流程模式会话代理,由 {{model}} 模型驱动。
      本模式由若水流程引擎接管:用户请求被 pre-step 拦截并启动流程编排,规划、执行、
      审查全部由编排内子代理承担,你(主会话模型)零参与,收不到任务原文,不做任何交付。
      判据:会话流中出现"若水编排已接管"等编排提示,即引擎在管;整段会话没有任何编排
      提示(引擎缺失或接管失败)时,你回退为普通会话代理,正常完成用户请求。
      引擎在管期间:用户运行中追加的消息不会丢失,将排队并在下一步骤边界投递进编排,
      纠偏类消息会被注入后续指令,无需重发;取消即时生效,暂停续跑即恢复,产出在会话
      页签与运行中心逐步可查。此时你只可能被调用于答疑:简短说明流程语义、进度查看
      方式与控制手段,不执行交付操作,不尝试启动、修改工作流或代替子代理产出。
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web ─────────────────────────────────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── compaction ──────────────────────────────────────────────────────────────

# 编排子代理上下文较长,保留 standard 的压缩组。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# workflowEngine 是预设私有服务,所有触达它的行共享一个 entry-local realm。
# takeover 行也在组内:pre-step 拦截用户消息并经 workflowEngine 启动编排。
# 控制队列与 store 为普通模块单例,host/agent 行经同一 realpath 解析共享实例。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    # 引擎接管行:流程模板由释放目录/包内 flows 锚定(flowFile 由 release 重写)
    - id: rs-workflow-takeover
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: takeover
        kind: flow
        flowFile: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('flows/default.json5', baseUrl))"

    # 模板编辑工具行:rs_workflow_template(AI 按口述逻辑生成/修改流程模板)
    - id: rs-workflow-template-tool
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: template-tool

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
