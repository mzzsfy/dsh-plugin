# The rs-workflow bundle patch: registers the host-plane rows of the rs-workflow
# all-in-one plugin into the profile root. Applied by
# `dsh plugin add @mzzsfy/dsh-rs-workflow`:
#   - rs-workflow / role settings: mounts the GUI settings form under the
#     `rs-workflow` namespace (slots / collab defaults / budgets / templates).
#   - rs-workflow-preset-sync / role preset-sync: syncs the bundled collab preset
#     (preset.yml + agent.cordis.yml) into the user preset root on every boot.
#   - rs-workflow-board / role board: mounts /api/rs-workflow/* routes (runs board
#     + flow template management/release).
# The preset-plane rows (rs_workflow_template / rs_workflow_report model tools and
# the takeover interceptor) live in released preset compositions, not here:
# model-facing tools and agent-scoped events belong to the preset plane.

- insert:
    - id: rs-workflow
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: settings
    - id: rs-workflow-preset-sync
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: preset-sync
    - id: rs-workflow-board
      name: '@mzzsfy/dsh-rs-workflow'
      config:
        role: board
