# The think-expand bundle patch: inserts the plugin row into the profile root.
# Applied by `dsh plugin add @mzzsfy/dsh-think-expand`; the row lets cordis load
# the host half (src/index.js, settings namespace registration) and the client
# module system discover this package's dsh.client declaration and serve
# src/client.js to the page.

- insert:
    - id: think-expand
      name: '@mzzsfy/dsh-think-expand'
