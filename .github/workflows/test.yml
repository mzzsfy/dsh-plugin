name: 测试

on:
  push:
    # 全部分支的提交推送;排除 tag 推送(发版 tag 不重复触发)
    branches: ['**']
  schedule:
    # UTC 03:00 = 北京 11:00;每 3 个日历日(按 day-of-month 取模,跨月间隔略有浮动)
    # 改期须与 compat.yml 的 schedule 同步
    - cron: '0 3 */3 * *'
  # 手动触发 = 全量(与定时同语义)
  workflow_dispatch:

permissions:
  contents: read

# push 同分支新提交取消在途运行;定时运行独立分组,不被 push 取消
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    name: 测试 x10 (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # 全量 10 轮干净基线 21 分钟(schedule run 42801314021 实测);push 全量遇慢节点
    # 贴线(42826980792 跑满 30 分钟被取消)。45 分钟 ≈ 2.1 倍基线,与 compat.yml 对齐
    timeout-minutes: 45
    strategy:
      # 双架构结果独立完整,一方失败不取消另一方
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      # 完整历史供 push 时 diff 出单包改动范围;定时/手动为全量,不依赖历史但统一开销可接受
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # CI 无 dsh 本体:按测试静态 import 闭包在仓库根装宿主 peer 与 zod
      # (session-manager 顶层 import zod;node ESM 逐级向上解析命中根 node_modules,
      # 镜像开发态 junction 桥);--no-save --no-package-lock 保证不产生任何入库文件。
      # schemastery 钉 3.18.4 = dsh-maintain peer 下限(3.18.2 无 volatile 方法,
      # Config 契约测试「根级单 ref get 协议」在 CI 恒红)
      # dsh 系包代际与根桥 package.json 一致(rc.3):tools/storage-domain/controller
      # 的 peer 闭包逐项显式列出——--legacy-peer-deps 下 npm 不落 peer,缺任一即
      # Cannot find package(cordis/storage/dsh-llm/dsh-subprocess 等);
      # aggregate-tests 的 missingBridgeDeps 也按根声明核对,根与 CI 清单必须一致
      # --legacy-peer-deps:storage-json 0.2.2 声明 peer 为 cordis ~4.1.0 + storage 0.2.2,
      # 与 CI 的 cordis 4.0.x / storage 0.2.1 不一致;测试只用它的 JsonStorageBackend,
      # 实际 import 的 StorageError/UNIT_NAME_RE 在 0.2.1 里都有,关掉 peer 仲裁才能装上。
      # 根 package.json 也声明了它,missingBridgeDeps 按根声明核对,CI 清单缺即全单元拒绝
      - name: 安装宿主 peer(仓库根解析桥)
        run: npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps @deepseek-ai/schemastery@3.18.4 @deepseek-ai/cordis@4.0.5 @deepseek-ai/dsh-storage-domain@0.2.1-rc.3 @deepseek-ai/dsh-storage-json@0.2.2-rc.1 @deepseek-ai/dsh-storage@0.2.1-rc.3 @deepseek-ai/dsh-tools@0.2.1-rc.3 @deepseek-ai/dsh-agent@0.2.1-rc.3 @deepseek-ai/dsh-llm@0.2.1-rc.3 @deepseek-ai/dsh-ptc-runtime@0.2.1-rc.3 @deepseek-ai/dsh-sandbox@0.2.1-rc.3 @deepseek-ai/dsh-sandbox-policy@0.2.1-rc.3 @deepseek-ai/dsh-session@0.2.1-rc.3 @deepseek-ai/dsh-user-approval@0.2.1-rc.3 @deepseek-ai/dsh-working-directory@0.2.1-rc.3 @deepseek-ai/dsh-scope@0.2.1-rc.3 @deepseek-ai/dsh-system-prompt@0.2.1-rc.3 @deepseek-ai/dsh-api-terminal-controller@0.2.1-rc.3 @deepseek-ai/dsh-subprocess@0.2.1-rc.3 zod@4.6.6
      # 含外部依赖的包自动发现并安装:显式 CLI spec(name@range;@mzzsfy 依赖映射
      # file:../ 同层包 symlink,未经 registry 解析,未发布依赖不再 ETARGET)。
      # 自依赖统一走符号链接桥,禁止经 registry 解析。
      # --legacy-peer-deps:devDeps 钉宿主开发基准(rc.2),上游 rc.3 发布后其新包
      # peer range 与钉版互踩(--omit=peer 下 npm 仍因顶层 devDeps 解析 peer 死),
      # legacy 语义跳过 peer 仲裁,与"peer 不经 registry 落地"的既定形态一致
      - name: 安装含外部依赖的包
        run: node scripts/install-externals.mjs
      # stock 浏览器用例走 playwright 内置 chromium: channel:'chrome' 依赖系统
      # Chrome, Google 不发 Linux arm64 版, arm64 runner 恒缺(amd64 预装才绿);
      # 内置构建两平台一致, 只装 chromium 本体(含 headless shell), 不装全量;
      # 缓存挂 ms-playwright, key 锁 playwright 1.63.0, 版本升级手动换 key 防旧二进制
      - name: 缓存 playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-1.63.0-${{ matrix.arch }}
      - name: 安装 playwright chromium
        run: npx playwright install --with-deps chromium
      # stock 浏览器用例在此渠道下跑: 置空系统 Chrome 形态, 用上面装的内置 chromium
      - name: 渠道变量
        run: echo "DSH_BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"
      # 包间依赖禁止经 npm registry 解析(不自依赖):@mzzsfy 全量符号链接到本地工作副本,
      # 必须在全部 npm install 之后执行,防止被安装过程清理
      - name: 自依赖全走本地(@mzzsfy 符号链接桥)
        run: |
          mkdir -p node_modules/@mzzsfy
          for dir in packages/*/; do
            ln -sfn "$(pwd)/${dir%/}" "node_modules/@mzzsfy/$(basename "$dir")"
          done
      # push 按改动范围收敛:全部改动落在 packages/<X>/ 时只测 X(冒烟与仓库根测试保留),
      # 触及任何非包路径或 diff 不可得则回退全量;定时/手动(无 before)为全量
      # 失败单元原始日志留存并上传:聚合器控制台只有用例名,flaky 取证依赖栈原文
      - name: 测试 x10
        run: node scripts/aggregate-tests.mjs --changed-since "${{ github.event.before }}"
        env:
          DSH_AGGREGATE_TEST_LOG_DIR: /tmp/agg-logs
      - name: 上传失败单元日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: unit-logs-${{ matrix.arch }}
          path: /tmp/agg-logs
          if-no-files-found: ignore
          retention-days: 7

