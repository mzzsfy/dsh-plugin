name: 全量测试

on:
  push:
    # 全部分支的提交推送;排除 tag 推送(发版 tag 不重复触发全量)
    branches: ['**']
  schedule:
    # UTC 03:00 = 北京 11:00;每 3 个日历日(按 day-of-month 取模,跨月间隔略有浮动)
    - cron: '0 3 */3 * *'

permissions:
  contents: read

# push 同分支新提交取消在途运行;定时运行独立分组,不被 push 取消
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    name: 全量测试 x10 (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 双架构结果独立完整,一方失败不取消另一方
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # CI 无 dsh 本体:按测试静态 import 闭包在仓库根装宿主 peer 与 zod
      # (session-manager 顶层 import zod;node ESM 逐级向上解析命中根 node_modules,
      # 镜像开发态 junction 桥);--no-save --no-package-lock 保证不产生任何入库文件
      - name: 安装宿主 peer(仓库根解析桥)
        run: npm install --no-save --no-package-lock --no-audit --no-fund @deepseek-ai/schemastery@3.18.2 @deepseek-ai/dsh-storage-domain@0.1.2-rc.1 @deepseek-ai/dsh-tools@0.1.2-rc.1 zod@4.5.4
      # 含外部依赖的包自动发现并安装(node ESM 逐级向上解析命中包内 node_modules);
      # dependencies/devDependencies 全为 @mzzsfy 自依赖、为空或缺失的包跳过——
      # 自依赖统一走符号链接桥,禁止经 registry 解析
      - name: 安装含外部依赖的包
        run: |
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            needs=$(node -e "const p=require(process.argv[1]); const f=k=>Object.keys(p[k]||{}).some(n=>!n.startsWith('@mzzsfy/')); process.stdout.write(f('dependencies')||f('devDependencies')?'yes':'no')" "$(pwd)/${dir}package.json")
            [ "$needs" = "yes" ] || continue
            echo "::group::安装包依赖 ${dir}"
            (cd "$dir" && npm install --omit=peer --no-save --no-package-lock --no-audit --no-fund) || exit 1
            echo "::endgroup::"
          done
      # 包间依赖禁止经 npm registry 解析(不自依赖):@mzzsfy 全量符号链接到本地工作副本,
      # 必须在全部 npm install 之后执行,防止被安装过程清理
      - name: 自依赖全走本地(@mzzsfy 符号链接桥)
        run: |
          mkdir -p node_modules/@mzzsfy
          for dir in packages/*/; do
            ln -sfn "$(pwd)/${dir%/}" "node_modules/@mzzsfy/$(basename "$dir")"
          done
      - name: 全量测试 x10
        run: |
          total=10
          failures=0
          failed_units=""
          # 失败单元的完整输出按 单元-轮次 落盘,收尾时提取失败明细;通过即删
          log_dir=$(mktemp -d)
          trap 'rm -rf "$log_dir"' EXIT
          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # 提取失败用例名:删段头行,去缩进/✖ 字形/耗时,按执行序去重
          names_from_logs() {
            grep -hE '^[[:space:]]*✖' "$@" 2>/dev/null | sed -E '/✖ failing tests:/d; s/^[[:space:]]*✖[[:space:]]*//; s/ \([0-9.]+ms\)$//' | awk '!seen[$0]++'
          }
          unit_fail_count() {
            grep -m1 '^ℹ fail' "$1" | awk '{print $3}' || true
          }
          run_unit() {
            local name="$1"; shift
            local log="${log_dir}/${name}-${round}.log"
            if "$@" >"$log" 2>&1; then
              echo "OK   ${name}"
              rm -f "$log"
            else
              local fail_count
              fail_count=$(unit_fail_count "$log")
              echo "FAIL ${name} (失败用例 ${fail_count:-?})"
              failed_units="${failed_units} ${name}"
              # 精确路径追加进 per-unit 清单:天然按轮次序,且避免前缀包名 glob 串档
              echo "$log" >> "${log_dir}/failed-${name}.list"
              failures=$((failures+1))
              # 失败用例名预览(套件标记一并呈现)
              names_from_logs "$log" | head -5 | sed 's/^/  ✖ /' || true
            fi
          }
          for round in $(seq 1 "$total"); do
            echo "::group::第 ${round}/${total} 轮"
            round_start=$failures
            run_unit smoke-load node scripts/smoke-load.mjs
            # 包自动发现:凡含 test/ 目录的包全量执行,新增包无需改本文件
            for dir in packages/*/; do
              [ -d "${dir}test" ] || continue
              run_unit "$(basename "$dir")" bash -c "cd '$dir' && node --test \"test/*.test.mjs\""
            done
            echo "本轮失败单元数: $((failures-round_start))"
            echo "::endgroup::"
          done
          echo "汇总: ${total} 轮, 失败单元累计 ${failures}"
          if [ -n "$failed_units" ]; then
            echo "失败单元清单(次数=失败轮数):"
            printf '%s\n' ${failed_units} | sort | uniq -c | while read -r count name; do
              echo "  ${count}x ${name}"
              logs=$(cat "${log_dir}/failed-${name}.list" 2>/dev/null || true)
              first_log=$(printf '%s\n' "$logs" | head -1 || true)
              rounds_info=""
              for lg in $logs; do
                r=${lg##*/}; r=${r#"${name}-"}; r=${r%.log}
                fc=$(unit_fail_count "$lg")
                rounds_info+="第${r}轮(${fc:-?}) "
              done
              names=$(names_from_logs $logs | head -5 | paste -sd ';' - || true)
              # 注解 message 段中 % 须转义,防止用例名含 %xx 被 runner 解码
              names=${names//%/%25}
              echo "::error::单元失败 ${count}/${total} 轮: ${name} | 失败轮次: ${rounds_info}| 用例: ${names:-无用例锚点,看失败明细}"
              {
                echo "### ${name}(失败 ${count}/${total} 轮: ${rounds_info})"
                if [ -n "$first_log" ]; then
                  # head 提前关管道会让 sed 吃 SIGPIPE,pipefail 下必须兜退出码,否则 set -e 中断汇总
                  section=$(sed -n '/^✖ failing tests:/,$p' "$first_log" | head -200 || true)
                  echo '<details><summary>失败明细(首轮错误与堆栈)</summary>'
                  echo
                  echo '```text'
                  if [ -n "$section" ]; then printf '%s\n' "$section"; else tail -50 "$first_log"; fi
                  echo '```'
                  echo '</details>'
                fi
              } >> "$summary_file"
            done
          fi
          [ "$failures" -eq 0 ]

  # 兼容性测试:真实 dsh 宿主 × 版本窗口(基线/主测槽阻塞,前瞻槽非阻塞预警)。
  # 隔离 profile 装全部 bundle 包全家桶共启,断言统一底线:正常访问 + activation live +
  # diagnostics findings 0 + 浏览器页面无 Failed to load plugins(方法论:
  # docs/兼容性测试/测试与隔离方法.md,自动化实现 scripts/compat/)。
  # 版本窗口策略见 scripts/compat/window.mjs;显式覆盖:DSH_COMPAT_VERSIONS=版本[,版本~]
  compat:
    name: dsh 兼容性测试(全家桶 boot)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_PIN: 1.63.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安装 pnpm(宿主与隔离 profile 安装依赖)
        run: npm install -g pnpm@11
      - name: 解析版本窗口
        run: mkdir -p .compat && node scripts/compat/window.mjs > .compat/window.json && cat .compat/window.json
      - name: 取 pnpm store 路径
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: 缓存 pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: compat-pnpm-${{ hashFiles('.compat/window.json') }}
          restore-keys: compat-pnpm-
      - name: 缓存 chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: compat-pw-${{ env.PLAYWRIGHT_PIN }}
      - name: 安装 chromium
        run: npx -y playwright@${{ env.PLAYWRIGHT_PIN }} install --with-deps chromium
      # 根解析桥与 playwright 必须同一条命令:--no-save 安装会清理请求之外的多余包
      - name: 安装仓库根解析桥(宿主 peer 与 zod)+ playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund @deepseek-ai/schemastery@3.18.2 @deepseek-ai/dsh-storage-domain@0.1.2-rc.1 @deepseek-ai/dsh-tools@0.1.2-rc.1 zod@4.5.4 playwright@${{ env.PLAYWRIGHT_PIN }}
      - name: 兼容性测试(逐版本全家桶 boot)
        run: node scripts/compat/ci.mjs
